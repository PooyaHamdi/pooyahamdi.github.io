name: Build and deploy site

on:
  push:
    branches: [main, static-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONTENT_AUTOEXPORT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Load content into a fresh database
        run: |
          python manage.py migrate --noinput
          python manage.py loaddata content/site.json

      - name: Run tests
        run: python manage.py test

      - name: Render static HTML
        run: python manage.py build_site --output _site --base-path "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
